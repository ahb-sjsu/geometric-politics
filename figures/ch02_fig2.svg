<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-label="A head-to-head poll measures the axis the two candidates define"><rect width="100%" height="100%" fill="#0b1622"/><text x="18" y="27" font-family="'Crimson Pro', Georgia, 'Times New Roman', serif" font-size="17" font-weight="600" fill="#e8ecf0">A head-to-head poll measures the axis the two candidates define</text><rect x="43.40" y="61.00" width="423.20" height="322.00" fill="none" stroke="#1b2e40" stroke-width="1"/><line x1="67.05" y1="308.75" x2="442.95" y2="135.25" stroke="#a9bccd" stroke-width="1.5" stroke-linecap="round" stroke-opacity="1.0"/><text x="73.05" y="328.75" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#a9bccd" text-anchor="start" font-weight="normal" font-style="italic">poll axis</text><line x1="291.63" y1="301.36" x2="188.69" y2="78.32" stroke="#8fa4b8" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="5 5" stroke-opacity="1.0"/><text x="299.63" y="305.36" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#a9bccd" text-anchor="start" font-weight="normal" font-style="italic">equally close to A and B</text><line x1="172.20" y1="189.80" x2="198.99" y2="247.85" stroke="#8fa4b8" stroke-width="1" stroke-linecap="round" stroke-dasharray="2 3" stroke-opacity="1.0"/><circle cx="172.20" cy="189.80" r="7.00" fill="#0b1622"/><circle cx="172.20" cy="189.80" r="5.00" fill="#8da0cb"><title>votes A</title></circle><text x="162.20" y="181.80" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#e8ecf0" text-anchor="end" font-weight="normal">votes A</text><line x1="347.00" y1="245.00" x2="322.09" y2="191.03" stroke="#8fa4b8" stroke-width="1" stroke-linecap="round" stroke-dasharray="2 3" stroke-opacity="1.0"/><circle cx="347.00" cy="245.00" r="7.00" fill="#0b1622"/><circle cx="347.00" cy="245.00" r="5.00" fill="#8da0cb"><title>votes B</title></circle><text x="357.00" y="261.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#e8ecf0" text-anchor="start" font-weight="normal">votes B</text><line x1="191.39" y1="84.17" x2="255.00" y2="222.00" stroke="#8fa4b8" stroke-width="1" stroke-linecap="round" stroke-dasharray="2 3" stroke-opacity="1.0"/><circle cx="191.39" cy="84.17" r="7.00" fill="#0b1622"/><circle cx="191.39" cy="84.17" r="5.00" fill="#8da0cb"><title>toss-up, far from both</title></circle><text x="203.39" y="88.17" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#e8ecf0" text-anchor="start" font-weight="normal">toss-up, far from both</text><circle cx="135.40" cy="277.20" r="9.00" fill="#0b1622"/><circle cx="135.40" cy="277.20" r="7.00" fill="#66c2a5"><title>candidate A</title></circle><text x="121.40" y="282.20" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#e8ecf0" text-anchor="end" font-weight="600">A</text><circle cx="374.60" cy="166.80" r="9.00" fill="#0b1622"/><circle cx="374.60" cy="166.80" r="7.00" fill="#fc8d62"><title>candidate B</title></circle><text x="388.60" y="171.80" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#e8ecf0" text-anchor="start" font-weight="600">B</text><text x="500.00" y="110.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#e8ecf0" text-anchor="start" font-weight="600">the candidates set the axis</text><text x="500.00" y="134.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#a9bccd" text-anchor="start" font-weight="normal">each voter is read only by</text><text x="500.00" y="150.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#a9bccd" text-anchor="start" font-weight="normal">the shadow they cast on it</text><text x="500.00" y="184.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#a9bccd" text-anchor="start" font-weight="normal">a voter who differs from both</text><text x="500.00" y="200.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#a9bccd" text-anchor="start" font-weight="normal">on another direction lands on</text><text x="500.00" y="216.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#a9bccd" text-anchor="start" font-weight="normal">the bisector: a toss-up</text><text x="500.00" y="250.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#a9bccd" text-anchor="start" font-weight="normal" font-style="italic">new candidates, new axis,</text><text x="500.00" y="266.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#a9bccd" text-anchor="start" font-weight="normal" font-style="italic">new apparent preferences</text><rect x="500.00" y="297.00" width="12" height="12" rx="3" fill="#66c2a5"/><text x="518.00" y="307.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#a9bccd" text-anchor="start" font-weight="normal">candidates</text><rect x="612.00" y="297.00" width="12" height="12" rx="3" fill="#8da0cb"/><text x="630.00" y="307.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#a9bccd" text-anchor="start" font-weight="normal">voters</text><text x="16.00" y="390.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#8fa4b8" text-anchor="start" font-weight="normal" font-style="italic">two of the six dimensions; positions illustrative</text></svg>