<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-label="Equal Euclidean steps, unequal Mahalanobis distances"><rect width="100%" height="100%" fill="#0b1622"/><text x="18" y="27" font-family="'Crimson Pro', Georgia, 'Times New Roman', serif" font-size="17" font-weight="600" fill="#e8ecf0">Equal Euclidean steps, unequal Mahalanobis distances</text><line x1="28.00" y1="216.00" x2="428.00" y2="216.00" stroke="#1b2e40" stroke-width="1" stroke-linecap="round" stroke-opacity="1.0"/><line x1="228.00" y1="88.00" x2="228.00" y2="344.00" stroke="#1b2e40" stroke-width="1" stroke-linecap="round" stroke-opacity="1.0"/><ellipse cx="228.00" cy="216.00" rx="88.00" ry="44.00" transform="rotate(0 228.00 216.00)" fill="#66c2a5" fill-opacity="0.1" stroke="#66c2a5" stroke-width="2"><title>Mahalanobis distance 1</title></ellipse><ellipse cx="228.00" cy="216.00" rx="176.00" ry="88.00" transform="rotate(0 228.00 216.00)" fill="#66c2a5" fill-opacity="0.04" stroke="#66c2a5" stroke-width="1.5"><title>Mahalanobis distance 2</title></ellipse><circle cx="228.00" cy="216.00" r="88.00" fill="none" fill-opacity="1.0" stroke="#8fa4b8" stroke-width="1.3" stroke-dasharray="5 5"/><text x="178.00" y="176.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#a9bccd" text-anchor="end" font-weight="normal" stroke="#0b1622" stroke-width="4" stroke-linejoin="round" paint-order="stroke">1</text><text x="72.00" y="166.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#a9bccd" text-anchor="end" font-weight="normal" stroke="#0b1622" stroke-width="4" stroke-linejoin="round" paint-order="stroke">2</text><line x1="228.00" y1="216.00" x2="316.00" y2="216.00" stroke="#e8ecf0" stroke-width="1.5" stroke-linecap="round" stroke-opacity="1.0"/><line x1="228.00" y1="216.00" x2="228.00" y2="128.00" stroke="#e8ecf0" stroke-width="1.5" stroke-linecap="round" stroke-opacity="1.0"/><circle cx="228.00" cy="216.00" r="5.50" fill="#0b1622"/><circle cx="228.00" cy="216.00" r="3.50" fill="#e8ecf0"><title>center</title></circle><circle cx="316.00" cy="216.00" r="7.50" fill="#0b1622"/><circle cx="316.00" cy="216.00" r="5.50" fill="#fc8d62"><title>P: Euclidean 2, Mahalanobis 1</title></circle><circle cx="228.00" cy="128.00" r="7.50" fill="#0b1622"/><circle cx="228.00" cy="128.00" r="5.50" fill="#fc8d62"><title>Q: Euclidean 2, Mahalanobis 2</title></circle><text x="325.00" y="234.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#e8ecf0" text-anchor="start" font-weight="600" stroke="#0b1622" stroke-width="4" stroke-linejoin="round" paint-order="stroke">P</text><text x="237.00" y="120.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#e8ecf0" text-anchor="start" font-weight="600" stroke="#0b1622" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Q</text><text x="434.00" y="212.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#a9bccd" text-anchor="start" font-weight="normal">high-variance</text><text x="434.00" y="227.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#a9bccd" text-anchor="start" font-weight="normal">dimension, σ = 2</text><text x="228.00" y="80.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#a9bccd" text-anchor="middle" font-weight="normal">low-variance dimension, σ = 1</text><text x="548.00" y="108.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#e8ecf0" text-anchor="start" font-weight="normal">P: Euclidean 2</text><text x="548.00" y="124.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#e8ecf0" text-anchor="start" font-weight="normal">Mahalanobis 1</text><text x="548.00" y="156.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#e8ecf0" text-anchor="start" font-weight="normal">Q: Euclidean 2</text><text x="548.00" y="172.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#e8ecf0" text-anchor="start" font-weight="normal">Mahalanobis 2</text><text x="548.00" y="214.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#a9bccd" text-anchor="start" font-weight="normal" font-style="italic">d_M = √((v1 − v2)ᵀ Σ⁻¹ (v1 − v2))</text><text x="548.00" y="234.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#a9bccd" text-anchor="start" font-weight="normal" font-style="italic">Σ = diag(4, 1), illustrative</text><rect x="16.00" y="375.00" width="12" height="12" rx="3" fill="#66c2a5"/><text x="34.00" y="385.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#a9bccd" text-anchor="start" font-weight="normal">Mahalanobis 1 and 2</text><text x="704.00" y="384.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#8fa4b8" text-anchor="end" font-weight="normal" font-style="italic">dashed: Euclidean distance 2</text></svg>