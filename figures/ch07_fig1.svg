<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-label="Three blocs, three majorities, one cycle (illustrative)"><rect width="100%" height="100%" fill="#0b1622"/><text x="18" y="27" font-family="'Crimson Pro', Georgia, 'Times New Roman', serif" font-size="17" font-weight="600" fill="#e8ecf0">Three blocs, three majorities, one cycle (illustrative)</text><line x1="231.84" y1="127.21" x2="327.10" y2="281.09" stroke="#a9bccd" stroke-width="2" stroke-linecap="round" stroke-opacity="1.0"/><line x1="327.10" y1="281.09" x2="319.99" y2="277.43" stroke="#a9bccd" stroke-width="2" stroke-linecap="round" stroke-opacity="1.0"/><line x1="327.10" y1="281.09" x2="327.00" y2="273.09" stroke="#a9bccd" stroke-width="2" stroke-linecap="round" stroke-opacity="1.0"/><text x="306.41" y="194.78" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#e8ecf0" text-anchor="middle" font-weight="600">67–33</text><line x1="313.00" y1="310.00" x2="119.00" y2="310.00" stroke="#a9bccd" stroke-width="2" stroke-linecap="round" stroke-opacity="1.0"/><line x1="119.00" y1="310.00" x2="125.86" y2="305.88" stroke="#a9bccd" stroke-width="2" stroke-linecap="round" stroke-opacity="1.0"/><line x1="119.00" y1="310.00" x2="125.86" y2="314.12" stroke="#a9bccd" stroke-width="2" stroke-linecap="round" stroke-opacity="1.0"/><text x="215.00" y="344.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#e8ecf0" text-anchor="middle" font-weight="600">68–32</text><line x1="101.84" y1="282.79" x2="197.10" y2="128.91" stroke="#a9bccd" stroke-width="2" stroke-linecap="round" stroke-opacity="1.0"/><line x1="197.10" y1="128.91" x2="197.00" y2="136.91" stroke="#a9bccd" stroke-width="2" stroke-linecap="round" stroke-opacity="1.0"/><line x1="197.10" y1="128.91" x2="189.99" y2="132.57" stroke="#a9bccd" stroke-width="2" stroke-linecap="round" stroke-opacity="1.0"/><text x="123.59" y="194.78" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#e8ecf0" text-anchor="middle" font-weight="600">65–35</text><circle cx="215.00" cy="100.00" r="28.00" fill="#1a3248" fill-opacity="1.0" stroke="#2a4a56" stroke-width="1"/><text x="215.00" y="106.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#e8ecf0" text-anchor="middle" font-weight="600">A</text><circle cx="345.00" cy="310.00" r="28.00" fill="#1a3248" fill-opacity="1.0" stroke="#2a4a56" stroke-width="1"/><text x="345.00" y="316.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#e8ecf0" text-anchor="middle" font-weight="600">B</text><circle cx="85.00" cy="310.00" r="28.00" fill="#1a3248" fill-opacity="1.0" stroke="#2a4a56" stroke-width="1"/><text x="85.00" y="316.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#e8ecf0" text-anchor="middle" font-weight="600">C</text><text x="215.00" y="252.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#8fa4b8" text-anchor="middle" font-weight="normal" font-style="italic">each arrow:</text><text x="215.00" y="267.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#8fa4b8" text-anchor="middle" font-weight="normal" font-style="italic">winner to loser</text><text x="452.00" y="84.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#e8ecf0" text-anchor="start" font-weight="600">the blocs and their rankings</text><text x="452.00" y="110.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#a9bccd" text-anchor="start" font-weight="normal">university enclave, 35%</text><text x="452.00" y="126.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#e8ecf0" text-anchor="start" font-weight="normal">A &gt; B &gt; C</text><text x="452.00" y="148.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#a9bccd" text-anchor="start" font-weight="normal">inner suburbs, 33%</text><text x="452.00" y="164.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#e8ecf0" text-anchor="start" font-weight="normal">B &gt; C &gt; A</text><text x="452.00" y="186.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#a9bccd" text-anchor="start" font-weight="normal">exurban belt, 32%</text><text x="452.00" y="202.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#e8ecf0" text-anchor="start" font-weight="normal">C &gt; A &gt; B</text><text x="452.00" y="238.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#e8ecf0" text-anchor="start" font-weight="600">pairwise majorities</text><text x="452.00" y="262.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#a9bccd" text-anchor="start" font-weight="normal">A over B: 35 + 32 = 67</text><text x="452.00" y="282.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#a9bccd" text-anchor="start" font-weight="normal">B over C: 35 + 33 = 68</text><text x="452.00" y="302.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#a9bccd" text-anchor="start" font-weight="normal">C over A: 33 + 32 = 65</text><text x="452.00" y="334.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#a9bccd" text-anchor="start" font-weight="normal" font-style="italic">no candidate beats both others</text><text x="16.00" y="390.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#8fa4b8" text-anchor="start" font-weight="normal" font-style="italic">District 7's three blocs, illustrative shares</text></svg>